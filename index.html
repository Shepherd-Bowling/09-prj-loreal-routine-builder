<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Routine Studio · L’Oréal</title><link rel="stylesheet" href="style.css"></head><body><header><img src="img/loreal-logo.png" alt="L’Oréal"><button id="direction" aria-pressed="false">RTL layout</button></header><main><h1>Routine <em>Studio</em></h1><p class="intro">Choose your products. Discover how to use them together.</p><div class="layout"><section><h2>Product library</h2><div class="filters"><input id="search" type="search" placeholder="Search products or ingredients" aria-label="Search products"><select id="category" aria-label="Filter by category"><option value="">All categories</option></select></div><p id="count" role="status"></p><div id="grid"></div></section><aside><section><h2>Selected products</h2><div id="selected"></div><button id="clear">Clear all</button><button class="primary" id="generate" disabled>Generate routine</button></section><section><h2>Your advisor</h2><div id="chat" role="log" aria-live="polite"></div><p id="status" role="status">Generate a routine to start chatting.</p><form><input id="question" dir="auto" placeholder="Ask a follow-up…" aria-label="Follow-up question" required disabled><button id="send" disabled>Send</button></form></section></aside></div></main><script src="script.js"></script></body></html>
